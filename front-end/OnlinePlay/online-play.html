<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morabaraba - Online Multiplayer</title>
    <link rel="stylesheet" href="../HumanVSHuman/style.css" />
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="../config.js"></script>
  </head>
  <body>
    <div class="game-container">

      <!-- Room code display -->
      <div class="status-bar" style="font-size:12px; color:#aaa; margin-bottom:5px;">
        Room: <span id="roomCodeDisplay">---</span> | Time: <span id="moveTimer" style="color:#fff; font-weight:bold;">60</span>s
      </div>

      <div class="info-bar">
        <div class="player-info" id="player1info">
          <span id="player1text">Player 1 (Dark)</span>:
          <span id="player1counter">0</span> on board,
          <span id="player1ToPlace">12</span> to place
        </div>
        <div class="player-info" id="player2info">
          <span id="player2text">Player 2 (Light)</span>:
          <span id="player2counter">0</span> on board,
          <span id="player2ToPlace">12</span> to place
        </div>
      </div>

      <div class="status-bar">
        <span id="statusText">Connecting to game...</span>
        <br />
        <span id="phaseText">Phase: Placement</span>
      </div>

      <!-- Game over modal -->
      <div class="modal" id="end-modal">
        <div class="end-modal-inner">
          <span class="end-stat" id="endStatText">Game Over</span>
          <span class="rating-text" id="eloChangeText"></span>
          <div class="reset-button-container">
            <button class="reset-button" id="rematchBtn">New Game</button>
            <a href="../HomePage/index.html"><button class="reset-button">Back to Menu</button></a>
          </div>
        </div>
      </div>

      <canvas
        id="myCanvas"
        width="600"
        height="600"
        style="border: 2px solid black; cursor: pointer"
      ></canvas>

      <div class="reset-button-container">
        <button class="reset-button" id="resignBtn">Resign</button>
        <a href="../HomePage/index.html"
          ><button class="reset-button">Back to Menu</button></a
        >
      </div>
    </div>

    <script src="./online-board.js" defer></script>
  </body>
</html>
