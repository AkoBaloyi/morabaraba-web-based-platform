<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morabaraba - Human vs Human</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="game-container">
      <!-- Game info panel at the top -->
      <div class="info-bar">
        <div class="player-info" id="player1info">
          Player 1 (Dark): 0 on board, 12 to place
        </div>
        <div class="player-info" id="player2info">
          Player 2 (Light): 0 on board, 12 to place
        </div>
      </div>

      <!-- Status message - shows whose turn, what phase, capture needed, etc -->
      <div class="status-bar">
        <span id="statusText">Player 1 (Dark)'s turn</span>
        <br />
        <span id="phaseText">Phase: Placement</span>
      </div>

      <!--Won or Lost modal-->

      <div class="modal" id="end-modal">
        <div class="end-modal-inner">

          <span class="end-stat">End Game Status</span> <!--Shold display Game Won or Game lost-->

          <span class="rating-text">New Rating: <span class="elo-update">250</span></span>

          <div class="reset-button-container">

            <button class="reset-button" onclick="resetGame()">Try Again</button>

            <a href="../HomePage/index.html"><button class="reset-button">Back to Menu</button></a>

          </div>
          
          
        </div>
      </div>

      <!-- The game board canvas -->
      <canvas
        id="myCanvas"
        width="600"
        height="600"
        style="border: 2px solid black"
      ></canvas>

      <div class="reset-button-container">
        <button class="reset-button" onclick="resetGame()">Reset Board</button>
        <a href="../HomePage/index.html"
          ><button class="reset-button">Back to Menu</button></a
        >
      </div>
    </div>

    <!-- Set game mode BEFORE loading the controller -->
    <script>
      window.GAME_MODE = "human";
    </script>
    <!-- Load engine first, then the controller -->
    <script src="../engine-bundle.js" defer></script>
    <script src="../game-controller.js" defer></script>
  </body>
</html>
